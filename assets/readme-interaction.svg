<svg xmlns="http://www.w3.org/2000/svg" width="1440" height="760" viewBox="0 0 1440 760" role="img" aria-labelledby="title desc">
<title id="title">Frontier Model Efficiency Map interaction preview</title>
<desc id="desc">Interaction preview showing a fixed detail panel and compact chart tooltip.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#111827"/><stop offset="1" stop-color="#05070b"/></linearGradient>
  <linearGradient id="panel" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#141922"/><stop offset="1" stop-color="#0b0f15"/></linearGradient>
  <style>.h1{font:700 40px Arial,sans-serif;fill:#f4f7fb}.h2{font:700 27px Arial,sans-serif;fill:#f4f7fb}.p{font:400 18px Arial,sans-serif;fill:#aab4c4}.mini{font:600 13px Arial,sans-serif;fill:#93a0b4;letter-spacing:.08em}.small{font:500 14px Arial,sans-serif;fill:#aab4c4}.label{font:700 14px Arial,sans-serif;fill:#dce5f4}</style>
</defs>
<rect width="1440" height="760" fill="#05070b"/>
<rect x="40" y="32" rx="24" width="1360" height="696" fill="url(#bg)" stroke="#202736"/>
<g transform="translate(92,86)">
  <text class="mini" x="0" y="18">INTERACTION HIGHLIGHT</text><text class="h1" x="0" y="60">识别点位，不再遮挡图表</text><text class="p" x="0" y="94">图内只显示 Model ID + 倍率；完整参数固定显示在筛选器与图表之间。</text>
  <g transform="translate(0,130)">
    <rect width="1256" height="120" rx="18" fill="#0d131b" stroke="#273041"/>
    <text x="24" y="31" class="mini">MODEL DETAIL</text><text x="24" y="70" class="h2">GPT-6.1 Sol · Medium</text><text x="24" y="96" class="small">OpenAI · 第三方统一实测</text>
    <line x1="380" y1="18" x2="380" y2="102" stroke="#1f2937"/><line x1="590" y1="18" x2="590" y2="102" stroke="#1f2937"/><line x1="800" y1="18" x2="800" y2="102" stroke="#1f2937"/><line x1="1010" y1="18" x2="1010" y2="102" stroke="#1f2937"/>
    <text x="406" y="35" class="mini">AA INTELLIGENCE</text><text x="406" y="78" class="h2">48</text>
    <text x="616" y="35" class="mini">综合能力</text><text x="616" y="78" class="h2">82.8</text>
    <text x="826" y="35" class="mini">AA 单任务成本</text><text x="826" y="78" class="h2">$0.21</text>
    <text x="1036" y="35" class="mini">调整后消耗倍率</text><text x="1036" y="78" class="h2">2.54×</text>
  </g>
  <g transform="translate(0,278)">
    <rect width="1256" height="314" rx="22" fill="url(#panel)" stroke="#273041"/>
    <text x="24" y="34" class="mini">CHART TOOLTIP</text><text x="24" y="68" class="h2">Hover / Tap 后保持识别上下文</text>
    <g transform="translate(34,90)">
      <rect width="1188" height="190" rx="18" fill="#0b1016" stroke="#1d2634"/>
      <g stroke="#273041" stroke-dasharray="8 8" opacity=".8"><line x1="120" y1="18" x2="120" y2="170"/><line x1="316" y1="18" x2="316" y2="170"/><line x1="512" y1="18" x2="512" y2="170"/><line x1="708" y1="18" x2="708" y2="170"/><line x1="904" y1="18" x2="904" y2="170"/><line x1="50" y1="50" x2="1120" y2="50"/><line x1="50" y1="108" x2="1120" y2="108"/><line x1="50" y1="164" x2="1120" y2="164"/></g>
      <polyline fill="none" stroke="#95c8ff" stroke-width="6" points="58,162 162,126 286,94 452,64 644,44 842,25 1080,18"/>
      <circle cx="452" cy="64" r="16" fill="#50dd9c"/><circle cx="644" cy="44" r="16" fill="#9f77ff"/><circle cx="842" cy="25" r="16" fill="#ffd34d"/>
      <g transform="translate(670,52)"><rect width="228" height="62" rx="14" fill="#0c1017" stroke="#3a4354"/><text x="16" y="25" class="label">GPT-6.1 Sol · Medium</text><text x="16" y="47" class="small">2.54× Luna Max</text></g>
    </g>
  </g>
</g>
</svg>